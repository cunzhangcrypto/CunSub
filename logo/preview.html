<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>CunSub Logo</title>
<style>
  body { margin: 0; min-height: 100vh; background: #0b0f17; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 40px 20px; font-family: Consolas, Monaco, monospace; box-sizing: border-box; }
  .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(34,211,238,0.15); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  img { max-width: 90vw; }
  .lockup img { max-height: 300px; }
  .icon img { max-height: 320px; }
  .tag { color: #64748b; font-size: 13px; }
  .tag b { color: #22d3ee; }
</style>
</head>
<body>
  <div class="card lockup">
    <img src="cunsub-logo.png" alt="CunSub Logo 组合版">
    <div class="tag"><b>CunSub</b> 组合版 · 图标 + 文字</div>
  </div>
  <div class="card icon">
    <img src="cunsub-logo-icon.png" alt="CunSub Logo 图标">
    <div class="tag">纯图标版 · 透明背景 · 2048×2048</div>
  </div>
</body>
</html>
